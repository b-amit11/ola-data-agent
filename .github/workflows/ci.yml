name: tests
on: [push, pull_request]
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m ola_agent.seed
      - run: python -m pytest -q
      - run: python -m ola_agent.evaluate

  postgres:
    # Runs the opt-in PostgreSQL tests against the real SELECT-only role from compose.yaml,
    # including the check that the database itself rejects writes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m ola_agent.seed
      - run: docker compose up -d --wait postgres
      - run: TEST_POSTGRES=1 python -m pytest -q
      - run: python -m ola_agent.evaluate --postgres
      - if: always()
        run: docker compose logs postgres --tail 50
